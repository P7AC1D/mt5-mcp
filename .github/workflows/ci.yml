name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      # Tests inject fake native calls, including on Windows. Never send orders.
      - run: uv run --locked --python ${{ matrix.python-version }} pytest -v
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/windows/Test-ScriptSyntax.ps1
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run --locked ruff format --check src/ tests/
      - run: uv run --locked ruff check src/ tests/
      - run: uv run --locked pyright
