[project]
name = "mcp-server-mt5"
version = "0.1.0"
description = "MCP Server for MetaTrader 5 API integration - enables AI assistants to perform market analysis and manage trades"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
keywords = ["mcp", "metatrader", "mt5", "trading", "ai", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.2.0",
    "MetaTrader5>=5.0.45",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[project.scripts]
mcp-server-mt5 = "mcp_server_mt5:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_mt5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
