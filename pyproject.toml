[project]
name = "mcp-server-mt5"
version = "0.2.0"
description = "MCP Server for MetaTrader 5 API integration - enables AI assistants to perform market analysis and manage trades"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Warren Roberson", email = "warren.roberson@gmail.com" }]
keywords = ["mcp", "metatrader", "mt5", "trading", "ai", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp==2.3.0",
    "MetaTrader5==5.0.6231; sys_platform == 'win32'",
    "pydantic>=2.0",
    "pydantic-settings>=2.0,<3",
    "starlette>=1.0,<2",
    "uvicorn>=0.35,<1",
    "jsonschema>=4.20,<5",
    "anyio>=4.5,<5",
    "httpx2>=2.13,<3",
]

[project.urls]
Homepage = "https://github.com/P7AC1D/mt5-mcp"
Repository = "https://github.com/P7AC1D/mt5-mcp"
Issues = "https://github.com/P7AC1D/mt5-mcp/issues"
Changelog = "https://github.com/P7AC1D/mt5-mcp/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "numpy>=2,<3",
    "ruff>=0.16,<1",
    "httpx>=0.28,<1",
    "pyright>=1.1.400",
]

[project.scripts]
mcp-server-mt5 = "mcp_server_mt5:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_mt5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src"]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
